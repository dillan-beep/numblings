<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visuals gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
  <style>
    .gallery { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .card { background: var(--panel); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
    .card h3 { font-size: 1rem; margin-bottom: 6px; }
    .card h3 .tag { font-size: 0.75rem; color: var(--accent); margin-left: 6px; }
    .card .spec { font-family: monospace; font-size: 0.72rem; color: var(--muted); white-space: pre-wrap; margin-bottom: 8px; }
    .card .vis { background: #fff; border-radius: 12px; padding: 8px; }
    #log { background: #141733; border-radius: 12px; padding: 12px; font-family: monospace; font-size: 0.85rem; max-height: 180px; overflow: auto; position: sticky; top: 8px; z-index: 5; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Visuals gallery</h1>
    <p class="muted">Every visual type from docs/contracts.md. Interactive ones log onAnswer below.</p>
    <pre id="log">onAnswer log:</pre>
    <div class="gallery" id="gallery"></div>
  </div>
  <script type="module">
    import { renderVisual, mountVisual, isInteractive } from '/src/visuals/index.js';

    const EXAMPLES = [
      { type: 'tenframe', count: 7 },
      { type: 'tenframe', counts: [6, 3] },
      { type: 'counters', count: 6, icon: 'apple' },
      { type: 'counters', count: 17, icon: 'star' },
      { type: 'numberline', min: 0, max: 10, highlight: 4, marks: [7] },
      { type: 'numberline', min: 0, max: 100, step: 2 },
      { type: 'numberline', min: 0, max: 20, question: 'point' },
      { type: 'base10', value: 247 },
      { type: 'array', rows: 3, cols: 5 },
      { type: 'fractionbar', parts: 4, shaded: 3 },
      { type: 'fractionbar', bars: [{ parts: 2, shaded: 1 }, { parts: 4, shaded: 2 }, { parts: 8, shaded: 4 }] },
      { type: 'fractionbar', parts: 6, shaded: 0, select: true },
      { type: 'fractioncircle', parts: 8, shaded: 5 },
      { type: 'clock', hour: 3, minute: 30 },
      { type: 'clock', set: true },
      { type: 'coins', toonies: 1, loonies: 1, quarters: 2, nickels: 3, dimes: 2 },
      { type: 'coins', us: true, quarters: 1, dimes: 2, nickels: 1, pennies: 4 },
      { type: 'shape', kind: 'rectangle', w: 6, h: 3 },
      { type: 'shape', kind: 'hexagon' },
      { type: 'angle', degrees: 45 },
      { type: 'angle', degrees: 90 },
      { type: 'grid', w: 8, h: 6, points: [[2, 3, 'A'], [5, 1, 'B']] },
      { type: 'grid', w: 10, h: 10, question: 'point' },
      { type: 'bargraph', categories: [{ label: 'Red', value: 4 }, { label: 'Blue', value: 7 }, { label: 'Green', value: 2 }, { label: 'Pink', value: 5 }] },
      { type: 'pictograph', rows: [{ label: 'Cats', count: 6 }, { label: 'Dogs', count: 9 }, { label: 'Fish', count: 3 }], icon: 'heart', each: 2 },
      { type: 'balance', left: ['3', '4'], right: ['5'] },
      { type: 'balance', left: ['x', '2'], right: ['7'] },
      { type: 'ruler', length: 7, unit: 'cm', max: 10 },
      { type: 'ruler', length: 3.5, unit: 'in', max: 6 },
      { type: 'thermometer', value: 23, min: -10, max: 40 },
      { type: 'area', w: 5, h: 3, unitLabel: 'cm' },
    ];

    const log = document.getElementById('log');
    const gallery = document.getElementById('gallery');
    for (const spec of EXAMPLES) {
      const card = document.createElement('div');
      card.className = 'card';
      const interactive = isInteractive(spec);
      card.innerHTML =
        `<h3>${spec.type}${interactive ? '<span class="tag">interactive</span>' : ''}</h3>` +
        `<div class="spec">${JSON.stringify(spec)}</div>` +
        `<div class="vis">${renderVisual(spec)}</div>`;
      gallery.appendChild(card);
      if (interactive) {
        const vis = card.querySelector('.vis');
        mountVisual(spec, vis, {
          onAnswer(v) {
            log.textContent += `\n${spec.type}: ${v}`;
            log.scrollTop = log.scrollHeight;
          },
        });
      }
    }
  </script>
</body>
</html>
